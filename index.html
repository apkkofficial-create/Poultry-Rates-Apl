<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Poultry Rates</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 14px; padding: 20px; max-width: 420px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    .date { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #334155; font-size: 17px; }
    .price { color: #4ade80; font-weight: bold; font-size: 18px; }
    .share-btn { width: 100%; background: #22c55e; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🐔 AP డైలీ పౌల్ట్రీ రేట్లు</h2>
    <div class="date">తేదీ: 03-09-2026</div>

    <div class="row"><span>గుడ్డు (100 Eggs):</span><span class="price">₹480</span></div>
    <div class="row"><span>సింగిల్ గుడ్డు (Piece):</span><span class="price">₹4.80</span></div>
    <div class="row"><span>లైవ్ బర్డ్ (Live 1kg):</span><span class="price">₹110</span></div>
    <div class="row"><span>స్కిన్‌లెస్ (Skinless 1kg):</span><span class="price">₹210</span></div>

    <button class="share-btn" onclick="shareRates()">📲 వాట్సాప్‌లో షేర్ చేయండి</button>
  </div>

  <script>
    function shareRates() {
      const text = encodeURIComponent("🐔 AP డైలీ పౌల్ట్రీ రేట్లు:\n\n🥚 100 Eggs: ₹480\n🍗 Live 1kg: ₹110\n🥩 Skinless 1kg: ₹210\n\nతాజా రేట్ల కోసం లింక్ చూడండి!");
      window.open("https://api.whatsapp.com/send?text=" + text, "_blank");
    }
  </script>
</body>
</html>
