<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Daily Poultry Rates</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1329; color: #fff; margin: 0; padding: 16px; }
    .container { max-width: 450px; margin: auto; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: #38bdf8; margin: 0 0 6px 0; font-weight: 800; }
    .timing-badge { background: #1e293b; border: 1px solid #3b82f6; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #94a3b8; margin-bottom: 14px; text-align: center; line-height: 1.6; }
    .timing-badge span { color: #facc15; font-weight: bold; }
    .card { background: #1e293b; border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); border: 1px solid #334155; }
    .select-label { font-size: 13px; color: #38bdf8; margin-bottom: 8px; display: block; font-weight: 600; }
    .select-box { width: 100%; padding: 13px; background: #0f172a; color: white; border: 1.5px solid #3b82f6; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 15px; font-weight: bold; }
    .rate-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 15px; }
    .rate-item:last-child { border-bottom: none; }
    .price { color: #4ade80; font-weight: bold; font-size: 19px; }
    .btn { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-wa { background: #22c55e; color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.4); }
    .status-bar { text-align: center; font-size: 12px; color: #38bdf8; margin-top: 10px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐔 AP డైలీ పౌల్ట్రీ తాజా రేట్లు</h1>
    </div>

    <!-- మీరు rates.json లో మార్చే లైవ్ టైమింగ్స్ ఇక్కడ కనిపిస్తాయి -->
    <div class="timing-badge">
      ⏰ <b>మార్కెట్ టైమింగ్స్:</b><br>
      🥚 ఎగ్ రేట్: <span id="displayEggTime">ఉదయం 08:00 AM</span><br>
      🍗 చికెన్ రేట్: <span id="displayChickenTime">మధ్యాహ్నం 02:30 PM</span>
    </div>

    <div class="card">
      <label class="select-label">📍 మీ జిల్లాను ఎంచుకోండి:</label>
      <select class="select-box" id="district" onchange="renderRates()">
        <optgroup label="ప్రధాన పౌల్ట్రీ హబ్‌లు">
          <option value="wg">పశ్చిమ గోదావరి (West Godavari)</option>
          <option value="eg">తూర్పు గోదావరి (East Godavari)</option>
          <option value="elr">ఏలూరు (Eluru)</option>
          <option value="kkn">కాకినాడ (Kakinada)</option>
          <option value="kon">కోనసీమ (Konaseema)</option>
          <option value="ntr">ఎన్టీఆర్ జిల్లా / విజయవాడ</option>
          <option value="krs">కృష్ణా (Machilipatnam)</option>
          <option value="gtr">గుంటూరు (Guntur)</option>
          <option value="pal">పల్నాడు (Palnadu)</option>
          <option value="bpt">బాపట్ల (Bapatla)</option>
          <option value="ctr">చిత్తూరు (Chittoor)</option>
          <option value="tpt">తిరుపతి (Tirupati)</option>
        </optgroup>
        <optgroup label="కోస్తా & ఉత్తరాంధ్ర జిల్లాలు">
          <option value="vsp">విశాఖపట్నం (Visakhapatnam)</option>
          <option value="ana">అనకాపల్లి (Anakapalli)</option>
          <option value="vzm">విజయనగరం (Vizianagaram)</option>
          <option value="skm">శ్రీకాకుళం (Srikakulam)</option>
          <option value="pvy">పార్వతీపురం మన్యం</option>
          <option value="asr">అల్లూరి సీతారామరాజు</option>
          <option value="prk">ప్రకాశం (Prakasam)</option>
          <option value="nlr">శ్రీ పొట్టి శ్రీరాములు నెల్లూరు</option>
        </optgroup>
        <optgroup label="రాయలసీమ జిల్లాలు">
          <option value="knl">కర్నూలు (Kurnool)</option>
          <option value="ndl">నంద్యాల (Nandyal)</option>
          <option value="atp">అనంతపురం (Anantapur)</option>
          <option value="ssp">శ్రీ సత్యసాయి (Puttaparthi)</option>
          <option value="kdp">వైఎస్సార్ కడప (Kadapa)</option>
          <option value="ann">అన్నమయ్య (Rayachoty)</option>
        </optgroup>
      </select>

      <div class="rate-item">
        <span>🥚 100 గుడ్లు (Eggs)</span>
        <span class="price" id="egg100">లోడ్ అవుతోంది...</span>
      </div>
      <div class="rate-item">
        <span>🥚 సింగిల్ గుడ్డు (Piece)</span>
        <span class="price" id="eggPiece">-</span>
      </div>
      <div class="rate-item">
        <span>🍗 బ్రాయిలర్ లైవ్ (1 Kg)</span>
        <span class="price" id="liveBird">లోడ్ అవుతోంది...</span>
      </div>
      <div class="rate-item">
        <span>🥩 స్కిన్‌లెస్ చికెన్ (1 Kg)</span>
        <span class="price" id="skinless">-</span>
      </div>
    </div>

    <button class="btn btn-wa" onclick="shareWa()">📲 వాట్సాప్‌లో షేర్ చేయండి</button>
    <div class="status-bar" id="updateStatus">తాజా ధరలు లోడ్ చేయబడుతున్నాయి...</div>
  </div>

  <script>
    let currentRates = {};

    async function loadLiveRates() {
      try {
        const response = await fetch('rates.json?v=' + new Date().getTime());
        currentRates = await response.json();
        
        // లైవ్ టైమింగ్స్ అప్‌డేట్
        if (currentRates.egg_time) {
          document.getElementById('displayEggTime').innerText = currentRates.egg_time;
        }
        if (currentRates.chicken_time) {
          document.getElementById('displayChickenTime').innerText = currentRates.chicken_time;
        }
        if (currentRates.updated_status) {
          document.getElementById('updateStatus').innerText = '✅ ' + currentRates.updated_status;
        }

        renderRates();
      } catch (err) {
        document.getElementById('updateStatus').innerText = 'ఆఫ్‌లైన్ మోడ్';
      }
    }

    function renderRates() {
      const dist = document.getElementById('district').value;
      const data = currentRates[dist] || { egg: 475, live: 110 };
      const skinPrice = data.live + 100;

      document.getElementById('egg100').innerText = '₹' + data.egg;
      document.getElementById('eggPiece').innerText = '₹' + (data.egg / 100).toFixed(2);
      document.getElementById('liveBird').innerText = '₹' + data.live;
      document.getElementById('skinless').innerText = '₹' + skinPrice;
    }

    function shareWa() {
      const dName = document.getElementById('district').selectedOptions[0].text;
      const eggT = document.getElementById('displayEggTime').innerText;
      const chkT = document.getElementById('displayChickenTime').innerText;
      
      const msg = encodeURIComponent(`🐔 AP డైలీ పౌల్ట్రీ తాజా రేట్లు\n📍 జిల్లా: ${dName}\n\n🥚 100 గుడ్లు (${eggT}): ${document.getElementById('egg100').innerText}\n🥚 సింగిల్ గుడ్డు: ${document.getElementById('eggPiece').innerText}\n🍗 బ్రాయిలర్ లైవ్ (${chkT}): ${document.getElementById('liveBird').innerText}\n🥩 స్కిన్‌లెస్ చికెన్: ${document.getElementById('skinless').innerText}\n\nతాజా అప్‌డేట్స్ కోసం మా యాప్‌ని ఇప్పుడే డౌన్‌లోడ్ చేసుకోండి!`);
      window.open('https://api.whatsapp.com/send?text=' + msg, '_blank');
    }

    loadLiveRates();
  </script>
</body>
</html>
