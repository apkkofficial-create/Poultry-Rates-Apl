<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Daily Poultry Rates</title>
  <meta name="theme-color" content="#0b1329">
  <link rel="manifest" href="/Poultry-Rates-Api/manifest.json">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- OneSignal Push Notification Setup -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "df96df6e-2691-4c55-b97c-592aa03454f1",
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1329; color: #fff; margin: 0; padding: 16px; }
    .container { max-width: 450px; margin: auto; }
    .header { text-align: center; margin-bottom: 14px; }
    .header h1 { font-size: 20px; color: #38bdf8; margin: 0 0 6px 0; font-weight: 800; }
    .timing-badge { background: #1e293b; border: 1px solid #3b82f6; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #94a3b8; margin-bottom: 14px; text-align: center; line-height: 1.6; }
    .timing-badge span { color: #facc15; font-weight: bold; }
    .card { background: #1e293b; border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); border: 1px solid #334155; }
    .select-label { font-size: 13px; color: #38bdf8; margin-bottom: 8px; display: block; font-weight: 600; }
    .select-box { width: 100%; padding: 13px; background: #0f172a; color: white; border: 1.5px solid #3b82f6; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 15px; font-weight: bold; }
    .rate-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 15px; }
    .rate-item:last-child { border-bottom: none; }
    .price { color: #4ade80; font-weight: bold; font-size: 19px; }
    .btn { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; }
    .btn-wa { background: #22c55e; color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.4); }
    .status-bar { text-align: center; font-size: 12px; color: #38bdf8; margin-top: 10px; font-weight: 500; }

    /* స్క్రోలింగ్ అడ్వర్టైజ్మెంట్ స్టైల్స్ */
    .ad-ticker-bar {
      background: #1e293b;
      border: 1px solid #facc15;
      border-radius: 12px;
      overflow: hidden;
      white-space: nowrap;
      margin-top: 16px;
      padding: 10px 0;
      display: flex;
      align-items: center;
    }
    .ad-badge {
      background: #facc15;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      margin: 0 10px;
      flex-shrink: 0;
    }
    .ad-text-wrap {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 15s linear infinite;
    }
    .ad-text-wrap a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐔 AP డైలీ పౌల్ట్రీ తాజా రేట్లు</h1>
    </div>

    <div class="timing-badge">
      ⏰ <b>మార్కెట్ టైమింగ్స్:</b><br>
      🥚 ఎగ్ రేట్: <span id="displayEggTime">ఉదయం 08:00 AM</span><br>
      🍗 లైవ్ బర్డ్: <span id="displayChickenTime">మధ్యాహ్నం 02:30 PM</span>
    </div>

    <div class="card">
      <label class="select-label">📍 మీ జిల్లాను ఎంచుకోండి (Select District):</label>
      <select class="select-box" id="district" onchange="renderRates()">
        <optgroup label="కోస్తా & అమరావతి జిల్లాలు">
          <option value="gtr" data-zone="vja">గుంటూరు (Guntur)</option>
          <option value="ntr" data-zone="vja">ఎన్టీఆర్ జిల్లా / విజయవాడ</option>
          <option value="krs" data-zone="vja">కృష్ణా (Machilipatnam)</option>
          <option value="pal" data-zone="vja">పల్నాడు (Narasaraopet)</option>
          <option value="bpt" data-zone="vja">బాపట్ల (Bapatla)</option>
          <option value="elr" data-zone="vja">ఏలూరు (Eluru)</option>
        </optgroup>
        <optgroup label="గోదావరి జిల్లాలు">
          <option value="eg" data-zone="godavari">తూర్పు గోదావరి (Rajahmundry)</option>
          <option value="wg" data-zone="godavari">పశ్చిమ గోదావరి (Bhimavaram)</option>
          <option value="kkn" data-zone="godavari">కాకినాడ (Kakinada)</option>
          <option value="kon" data-zone="godavari">కోనసీమ (Amalapuram)</option>
        </optgroup>
        <optgroup label="ఉత్తరాంధ్ర జిల్లాలు">
          <option value="vsp" data-zone="vizag">విశాఖపట్నం (Visakhapatnam)</option>
          <option value="ana" data-zone="vizag">అనకాపల్లి (Anakapalli)</option>
          <option value="vzm" data-zone="vizag">విజయనగరం (Vizianagaram)</option>
          <option value="skm" data-zone="vizag">శ్రీకాకుళం (Srikakulam)</option>
          <option value="pvy" data-zone="vizag">పార్వతీపురం మన్యం</option>
          <option value="asr" data-zone="vizag">అల్లూరి సీతారామరాజు</option>
        </optgroup>
        <optgroup label="రాయలసీమ & దక్షిణ జిల్లాలు">
          <option value="knl" data-zone="rayalaseema">కర్నూలు (Kurnool)</option>
          <option value="ndl" data-zone="rayalaseema">నంద్యాల (Nandyal)</option>
          <option value="atp" data-zone="rayalaseema">అనంతపురం (Anantapur)</option>
          <option value="ssp" data-zone="rayalaseema">శ్రీ సత్యసాయి (Puttaparthi)</option>
          <option value="kdp" data-zone="rayalaseema">వైఎస్సార్ కడప (YSR Kadapa)</option>
          <option value="ann" data-zone="rayalaseema">అన్నమయ్య (Rayachoty)</option>
          <option value="ctr" data-zone="rayalaseema">చిత్తూరు (Chittoor)</option>
          <option value="tpt" data-zone="rayalaseema">తిరుపతి (Tirupati)</option>
          <option value="nlr" data-zone="rayalaseema">నెల్లూరు (Nellore)</option>
          <option value="prk" data-zone="rayalaseema">ప్రకాశం (Prakasam)</option>
        </optgroup>
      </select>

      <div class="rate-item">
        <span>🥚 1 గుడ్డు (Egg)</span>
        <span class="price" id="eggPiece">లోడ్ అవుతోంది...</span>
      </div>
      <div class="rate-item">
        <span>🥚 100 గుడ్లు (Eggs)</span>
        <span class="price" id="egg100">-</span>
      </div>
      <div class="rate-item">
        <span>🍗 బ్రాయిలర్ లైవ్ (1 Kg)</span>
        <span class="price" id="liveBird">-</span>
      </div>
      <div class="rate-item">
        <span>🥩 స్కిన్‌లెస్ చికెన్ (1 Kg)</span>
        <span class="price" id="skinless">-</span>
      </div>
    </div>

    <button class="btn btn-wa" onclick="shareWa()">📲 వాట్సాప్‌లో షేర్ చేయండి</button>

    <!-- ప్రకటన స్క్రోలర్ కంటెయినర్ -->
    <div id="adContainer" class="ad-ticker-bar" style="display: none;">
      <span class="ad-badge">AD</span>
      <div class="ad-text-wrap">
        <a id="adLink" href="#" target="_blank"></a>
      </div>
    </div>

    <div class="status-bar" id="updateStatus">తాజా ధరలు లోడ్ చేయబడుతున్నాయి...</div>
  </div>

  <script>
    let liveData = null;

    async function loadLiveRates() {
      try {
        const response = await fetch('/Poultry-Rates-Api/rates.json?v=' + new Date().getTime());
        liveData = await response.json();
        
        if (liveData.egg_time) document.getElementById('displayEggTime').innerText = liveData.egg_time;
        if (liveData.chicken_time) document.getElementById('displayChickenTime').innerText = liveData.chicken_time;
        if (liveData.updated_status) document.getElementById('updateStatus').innerText = '✅ ' + liveData.updated_status;

        // rates.json నుండి అడ్వర్టైజ్మెంట్ టెక్స్ట్ & లింక్ లోడ్ చేయడం
        if (liveData.ad_scroller && liveData.ad_scroller.enabled) {
          const adBox = document.getElementById('adContainer');
          const adLink = document.getElementById('adLink');
          adLink.innerText = liveData.ad_scroller.text;
          adLink.href = liveData.ad_scroller.link;
          adBox.style.display = 'flex';
        }

        renderRates();
      } catch (err) {
        document.getElementById('updateStatus').innerText = 'ఆఫ్‌లైన్ మోడ్ / ధరలు అందుబాటులో లేవు';
        document.getElementById('eggPiece').innerText = '-';
      }
    }

    function renderRates() {
      if (!liveData || !liveData.zones) return;

      const sel = document.getElementById('district');
      const selectedOpt = sel.selectedOptions[0];
      const zoneKey = selectedOpt.getAttribute('data-zone');
      const zone = liveData.zones[zoneKey] || liveData.zones['vja'];

      const piecePrice = Number(zone.egg_piece) || 0;
      const calculatedEgg100 = Math.round(piecePrice * 100);
      const livePrice = Number(zone.live) || 0;
      const skinPrice = zone.skinless ? Number(zone.skinless) : Math.round((livePrice / 0.67) + 30);

      document.getElementById('eggPiece').innerText = '₹' + piecePrice.toFixed(2);
      document.getElementById('egg100').innerText = '₹' + calculatedEgg100;
      document.getElementById('liveBird').innerText = '₹' + livePrice;
      document.getElementById('skinless').innerText = '₹' + skinPrice;
    }

    function shareWa() {
      const dName = document.getElementById('district').selectedOptions[0].text;
      const eggP = document.getElementById('eggPiece').innerText;
      const egg100 = document.getElementById('egg100').innerText;
      const live = document.getElementById('liveBird').innerText;
      const skin = document.getElementById('skinless').innerText;
      const eggT = document.getElementById('displayEggTime').innerText;
      const chkT = document.getElementById('displayChickenTime').innerText;

      const msg = encodeURIComponent(`🐔 AP డైలీ పౌల్ట్రీ తాజా రేట్లు\n📍 జిల్లా: ${dName}\n\n🥚 గుడ్డు రేట్ (${eggT}):\n▪️ 1 గుడ్డు: ${eggP}\n▪️ 100 గుడ్లు: ${egg100}\n\n🍗 చికెన్ రేట్ (${chkT}):\n▪️ లైవ్ బర్డ్ 1kg: ${live}\n▪️ స్కిన్‌లెస్ చికెన్: ${skin}\n\nతాజా మార్కెట్ రేట్ల కోసం చెక్ చేయండి!`);
      window.open('https://api.whatsapp.com/send?text=' + msg, '_blank');
    }

    // Service Worker గా OneSignalSDKWorker ను రిజిస్టర్ చేయడం
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Poultry-Rates-Api/OneSignalSDKWorker.js')
          .then((reg) => console.log('Service Worker Active'))
          .catch((err) => console.log('SW Error:', err));
      });
    }

    loadLiveRates();
  </script>
</body>
</html>
