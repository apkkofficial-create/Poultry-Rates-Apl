<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poultry Rates AP</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="/Poultry-Rates-Apl/manifest.json">
  <meta name="theme-color" content="#0b1329">

  <!-- Mobile Browser Styling -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/Poultry-Rates-Apl/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0b1329;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .card h2 {
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .rate-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.95rem;
    }
    .rate-row:not(:last-child) {
      border-bottom: 1px dashed #334155;
    }
    .rate-name {
      color: #cbd5e1;
    }
    .rate-value {
      font-weight: 700;
      color: #4ade80;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ఆంధ్రప్రదేశ్ పౌల్ట్రీ ధరలు</h1>
      <p>రోజువారీ చికెన్ & గుడ్డు తాజా మార్కెట్ రేట్లు</p>
    </header>

    <div id="loading">ధరల వివరాలు లోడ్ అవుతున్నాయి...</div>
    <div id="rates-display"></div>
  </div>

  <script>
    // rates.json నుండి డేటా లోడ్ చేయడం
    fetch('/Poultry-Rates-Apl/rates.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('rates-display');
        
        let html = '<div class="card"><h2>తాజా ధరల వివరాలు</h2>';
        for (const [key, value] of Object.entries(data)) {
          html += `
            <div class="rate-row">
              <span class="rate-name">${key}</span>
              <span class="rate-value">${value}</span>
            </div>
          `;
        }
        html += '</div>';
        container.innerHTML = html;
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'ధరలు లోడ్ చేయడంలో లోపం ఏర్పడింది.';
        console.error('Data load error:', err);
      });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Poultry-Rates-Apl/pwabuilder-sw.js')
          .then((reg) => console.log('SW Registered!', reg))
          .catch((err) => console.log('SW Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
