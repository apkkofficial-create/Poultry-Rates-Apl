<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Daily Poultry Rates</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2575fc">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #2575fc;
            margin-bottom: 10px;
        }
        .rate-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            border-left: 5px solid #2575fc;
        }
        .rate-item {
            font-size: 18px;
            margin: 10px 0;
            font-weight: bold;
        }
        button {
            background: #2575fc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #1a5db6;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🐔 AP పౌల్ట్రీ తాజా రేట్లు</h2>
        <p>తేదీ: <span id="current-date"></span></p>

        <div class="rate-box">
            <div class="rate-item">🥚 1 గుడ్డు: ₹<span id="egg-1">--</span></div>
            <div class="rate-item">🥚 100 గుడ్లు: ₹<span id="egg-100">--</span></div>
            <div class="rate-item">🐓 లైవ్ చికెన్ (1Kg): ₹<span id="chicken-live">--</span></div>
            <div class="rate-item">🍗 స్కిన్‌లెస్ చికెన్ (1Kg): ₹<span id="chicken-skinless">--</span></div>
        </div>

        <button id="share-btn">📤 WhatsApp లో షేర్ చేయండి</button>
    </div>

    <!-- Canvas for Image Generation -->
    <canvas id="rateCanvas" width="1080" height="1080"></canvas>

    <!-- OneSignal Push Notification SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "df96df6e-2691-4c55-b97c-592aa03454f1",
        });
      });
    </script>

    <script>
        // ఇక్కడ రేట్లు లోడ్ చేయడం మరియు ఇమేజ్ షేర్ చేసే కోడ్ ఉంటుంది
        async function loadRates() {
            try {
                const response = await fetch('rates.json');
                const data = await response.json();
                
                document.getElementById('current-date').innerText = data.date;
                document.getElementById('egg-1').innerText = data.egg1;
                document.getElementById('egg-100').innerText = data.egg100;
                document.getElementById('chicken-live').innerText = data.chickenLive;
                document.getElementById('chicken-skinless').innerText = data.chickenSkinless;
            } catch (error) {
                console.error('Error loading rates:', error);
            }
        }

        loadRates();

        // WhatsApp Share with Image and Text Link Functionality
        document.getElementById('share-btn').addEventListener('click', async () => {
            const canvas = document.getElementById('rateCanvas');
            const ctx = canvas.getContext('2d');

            // Canvas Background
            ctx.fillStyle = '#075e54';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Inner Card
            ctx.fillStyle = '#ffffff';
            ctx.roundRect(50, 50, 980, 980, 30);
            ctx.fill();

            // Text Styling
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🐔 AP పౌల్ట్రీ తాజా రేట్లు', canvas.width / 2, 150);

            ctx.font = '35px Arial';
            ctx.fillText('తేదీ: ' + document.getElementById('current-date').innerText, canvas.width / 2, 220);

            // Rates Text
            ctx.textAlign = 'left';
            ctx.font = 'bold 45px Arial';
            ctx.fillText('🥚 1 గుడ్డు: ₹' + document.getElementById('egg-1').innerText, 100, 380);
            ctx.fillText('🥚 100 గుడ్లు: ₹' + document.getElementById('egg-100').innerText, 100, 500);
            ctx.fillText('🐓 లైవ్ చికెన్ (1Kg): ₹' + document.getElementById('chicken-live').innerText, 100, 620);
            ctx.fillText('🍗 స్కిన్‌లెస్ చికెన్ (1Kg): ₹' + document.getElementById('chicken-skinless').innerText, 100, 740);

            ctx.textAlign = 'center';
            ctx.font = 'italic 30px Arial';
            ctx.fillStyle = '#555555';
            ctx.fillText('మరిన్ని అప్‌డేట్స్ కోసం మా యాప్ సందర్శించండి!', canvas.width / 2, 920);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'poultry-rates.png', { type: 'image/png' });
                
                const shareData = {
                    files: [file],
                    title: 'AP Daily Poultry Rates',
                    text: '🐔 తాజా పౌల్ట్రీ ధరల కోసం మా యాప్‌ను సందర్శించండి:\nhttps://apkkofficial-create.github.io/Poultry-Rates-Apl/'
                };

                if (navigator.canShare && navigator.canShare(shareData)) {
                    try {
                        await navigator.share(shareData);
                    } catch (error) {
                        console.log('Share canceled or failed', error);
                    }
                } else {
                    alert('మీ బ్రౌజర్ షేరింగ్‌ను సపోర్ట్ చేయడం లేదు.');
                }
            }, 'image/png');
        });
    </script>
</body>
</html>
